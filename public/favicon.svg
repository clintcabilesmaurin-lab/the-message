<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="sealBg" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="70%" stop-color="#261005" />
      <stop offset="100%" stop-color="#0c0502" />
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <linearGradient id="goldFill" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer ambient glow ring -->
  <circle cx="32" cy="32" r="30" fill="#f59e0b" opacity="0.15" filter="url(#glow)" />

  <!-- Wax seal body -->
  <circle cx="32" cy="32" r="28" fill="url(#sealBg)" stroke="url(#goldRim)" stroke-width="2.5" />

  <!-- Inner embossed decorative ring -->
  <circle cx="32" cy="32" r="23" stroke="#f59e0b" stroke-width="1" stroke-dasharray="2 3" opacity="0.6" />

  <!-- Embossed Heart -->
  <path d="M32 44.5 C32 44.5 20 36.5 20 28.5 C20 24 23.5 20.5 28 20.5 C30.2 20.5 31.8 21.8 32 22.8 C32.2 21.8 33.8 20.5 36 20.5 C40.5 20.5 44 24 44 28.5 C44 36.5 32 44.5 32 44.5 Z" 
        fill="url(#goldFill)" 
        stroke="#fef08a" 
        stroke-width="1.2" 
        filter="url(#glow)" />

  <!-- Delicate Quill Nib Accent -->
  <path d="M31.2 25 L32 23 L32.8 25 L32.3 35 L31.7 35 Z" fill="#fffbeb" opacity="0.9" />

  <!-- Sparkle top-right -->
  <circle cx="43" cy="21" r="1.5" fill="#fef08a" opacity="0.9" />
</svg>
